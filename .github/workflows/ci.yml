name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-fail-under=80
      - run: uv run zensical build

  graph-drift:
    name: graphify drift (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install graphifyy
      - name: Re-extract and compare structure
        run: |
          if [ ! -f graphify-out/graph.json ]; then
            echo "graphify-out/ not present yet (ROADMAP P0.6)"
            exit 0
          fi
          cp graphify-out/graph.json /tmp/committed-graph.json
          graphify extract . --code-only > /dev/null
          python scripts/check_graph_drift.py /tmp/committed-graph.json graphify-out/graph.json
