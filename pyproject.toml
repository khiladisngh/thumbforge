[project]
name = "thumbforge"
version = "0.0.0"
description = "Generate consistent, spec-compliant YouTube thumbnails from a hero image and a playlist."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gishant Singh", email = "khiladisngh@hotmail.com" }]
requires-python = ">=3.14"
keywords = ["youtube", "thumbnail", "cli", "image-generation", "typer"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "alembic>=1.14",
  "keyring>=25.0",
  "pillow>=10.0",
  "platformdirs>=4.11.10",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "rich>=15.0.0",
  "sqlalchemy>=2.0",
  "structlog>=26.1.0",
  "tenacity>=9.0",
  "tomli-w>=1.2.0",
  "typer",
  "yt-dlp>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/khiladisngh/thumbforge"
Documentation = "https://khiladisngh.github.io/thumbforge/"
Repository = "https://github.com/khiladisngh/thumbforge"
Issues = "https://github.com/khiladisngh/thumbforge/issues"
Changelog = "https://github.com/khiladisngh/thumbforge/blob/main/CHANGELOG.md"

[project.scripts]
thumbforge = "thumbforge.cli.app:main"

[project.entry-points."thumbforge.providers"]
# The entry-point name is the provider key; the value must be an ImageProvider class whose
# __init__ takes its config mapping. Third parties declare the same group to add a provider.
# fake = "thumbforge.providers.fake:FakeProvider"                 # P3.2
# antigravity = "thumbforge.providers.antigravity:AntigravityProvider"   # P3.4

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pre-commit",
  "import-linter",
  "zensical",
  "testcontainers>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so its models' imports must stay importable.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
# Typer builds its parameters from runtime type hints; guarding those imports behind
# TYPE_CHECKING makes the CLI fail at import time.
"src/thumbforge/cli/*.py" = ["TC001", "TC002", "TC003"]

[tool.pyright]
strict = ["src"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: hits the network or a real provider; opt in with -m integration",
  "golden: image snapshot comparison",
]
testpaths = ["tests"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["thumbforge"]
branch = true
omit = ["src/thumbforge/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "thumbforge"

# Dependency rule (PLAN.md §2.2): cli may use every adapter; core stays pure; adapters know
# only core; nothing imports cli. Extend the module lists — and the "adapters are independent"
# contract — in the PRs that create templates/ and imaging/; import-linter errors on a module
# that does not exist.
[[tool.importlinter.contracts]]
name = "nothing imports cli"
type = "forbidden"
source_modules = [
  "thumbforge.core",
  "thumbforge.storage",
  "thumbforge.sources",
  "thumbforge.providers",
  "thumbforge.settings",
  "thumbforge.logging",
  "thumbforge.credentials",
  "thumbforge.imaging",
]
forbidden_modules = ["thumbforge.cli"]

[[tool.importlinter.contracts]]
name = "core is pure"
type = "forbidden"
source_modules = ["thumbforge.core"]
forbidden_modules = [
  "thumbforge.storage",
  "thumbforge.sources",
  "thumbforge.providers",
  "thumbforge.cli",
  "thumbforge.settings",
  "thumbforge.logging",
  "thumbforge.credentials",
  "thumbforge.imaging",
]

[[tool.importlinter.contracts]]
name = "adapters are independent"
type = "independence"
modules = ["thumbforge.storage", "thumbforge.sources", "thumbforge.providers", "thumbforge.imaging"]

# `core` is one layer, so its modules may import each other — `core.models` needs
# `core.enums`, and the Phase 6 services need `core.models`. What must not happen is a
# cycle, so the shared leaves stay leaves. This is the machine-checked form of the
# "core imports nothing internal" rule in PLAN.md §2.2.
[[tool.importlinter.contracts]]
name = "core leaf modules import nothing from core"
type = "forbidden"
source_modules = [
  "thumbforge.core.enums",
  "thumbforge.core.errors",
  "thumbforge.core.ids",
  "thumbforge.core.json",
]
forbidden_modules = [
  "thumbforge.core.models",
  "thumbforge.core.providers",
  "thumbforge.core.urls",
]
